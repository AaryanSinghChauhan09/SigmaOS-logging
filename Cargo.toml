[package]
name = "sigmaos-logging"
version = "0.1.0"
edition = "2021"
authors = ["SigmaOS Project"]
description = "Logging and tracing system"
license = "GPL-3.0-or-later"
repository = "https://github.com/AaryanSinghChauhan09/SigmaOS-logging"
